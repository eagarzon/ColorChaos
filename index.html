<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ColorChaos</title>
<style>
/* ============================================================================
   ColorChaos — versión autocontenida de "Arrastra Colores", en un solo HTML.
   Sin Firebase, sin pared, sin admin remoto: todo el estado vive en memoria
   local (con un respaldo simple en localStorage por si hay un refresh
   accidental). El panel de ajustes reemplaza a admin.html como un modal local.
   ============================================================================ */
:root {
  --bg: #0b0e14;
  --panel: #141926;
  --panel-2: #1c2333;
  --border: #2b3346;
  --text: #eef1f7;
  --text-dim: #9aa4b8;
  --accent: #5b8def;
  --ok: #35c26a;
  --danger: #e5533d;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { overflow: hidden; overscroll-behavior: none; }

button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  border-radius: 0.6rem; padding: 0.6rem 1.1rem; font-size: 1rem;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 700; }
.btn-danger  { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-ghost   { background: transparent; }
.btn-sm { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
.btn-lg { padding: 1rem 2rem; font-size: 1.4rem; border-radius: 0.9rem; }
.btn-join { font-size: 2.2rem; line-height: 1; padding: 0.8rem 1.6rem; border-radius: 1rem; }
.btn-icon { font-size: 1.5rem; line-height: 1; padding: 0.55rem 0.9rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------------- MESA ---------------- */
#game { position: fixed; inset: 0; display: block; touch-action: none; }

#overlay { position: fixed; inset: 0; pointer-events: none; }
#overlay .side-panel {
  position: absolute; pointer-events: auto;
  display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
  background: rgba(20, 25, 38, 0.92); border: 1px solid var(--border);
  border-radius: 1rem; padding: 1rem 1.25rem; min-width: 15rem; max-width: 22rem;
}
#overlay .side-panel h3 { margin: 0; font-size: 1rem; }
#overlay .side-panel .row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
#overlay .side-panel input[type=text] {
  font: inherit; text-align: center; width: 12rem;
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 0.5rem; padding: 0.5rem 0.7rem;
}
.swatches { display: grid; grid-template-columns: repeat(4, 2.4rem); gap: 0.5rem; }
#overlay canvas.demo-ico { display: block; }

/* Resumen de ronda — sin texto de etiquetas, solo iconos de pelota + conteo */
#overlay .sum-name { font-weight: 800; font-size: 1.05rem; }
#overlay .sum-grid { display: flex; flex-wrap: wrap; gap: 0.45rem 0.7rem; justify-content: center; max-width: 20rem; }
#overlay .sum-item { display: flex; align-items: center; gap: 0.3rem; font-weight: 800; font-family: var(--mono); font-size: 1.1rem; }
#overlay .sum-item .pos { color: var(--ok); }
#overlay .sum-item .neg { color: var(--danger); }
#overlay canvas.ball-ico { width: 32px; height: 32px; display: block; }
#overlay .sum-total { font-family: var(--mono); font-size: 1rem; color: var(--text-dim); }
#overlay .sum-total .pos { color: var(--ok); font-weight: 800; }
#overlay .sum-total .neg { color: var(--danger); font-weight: 800; }
.swatch {
  width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
}
.swatch.sel { border-color: #fff; }
.swatch.taken { opacity: 0.25; cursor: not-allowed; }

/* Cada lado se coloca y rota hacia su asiento */
.at-top    { top: 3vh;    left: 50%; transform: translateX(-50%) rotate(180deg); }
.at-bottom { bottom: 3vh; left: 50%; transform: translateX(-50%); }
.at-left   { left: 3vh;   top: 50%;  transform: translateY(-50%) rotate(90deg); transform-origin: center; }
.at-right  { right: 3vh;  top: 50%;  transform: translateY(-50%) rotate(-90deg); transform-origin: center; }

.hidden { display: none !important; }

/* Botones de esquina: sonido | reiniciar | ajustes | pantalla completa, de izquierda a derecha. */
.corner-btn {
  position: fixed; top: 12px; right: 64px; z-index: 9990;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  padding: 0; margin: 0; border-radius: 0.6rem; cursor: pointer; font-size: 1.35rem; line-height: 1;
  font-family: inherit; color: var(--text); background: rgba(20,25,38,0.72);
  border: 1px solid var(--border); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0.55; transition: opacity 0.12s, transform 0.05s;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
.corner-btn:hover, .corner-btn:focus { opacity: 1; outline: none; }
.corner-btn:active { transform: scale(0.94); }
#soundBtn { right: 116px; }
#settingsBtn { right: 168px; }
#fsBtnCC { right: 12px; }

/* Logo Alsis: grande/opaco/clicable fuera de ronda; chico/tenue/no clicable durante countdown+playing. */
.logo-alsis {
  position: fixed; top: 12px; left: 12px; z-index: 9200; display: block; line-height: 0;
  opacity: 1; transition: opacity 0.35s ease;
}
.logo-alsis img { display: block; height: 56px; width: auto; transition: height 0.35s ease; }
.logo-alsis.ingame { opacity: 0.35; pointer-events: none; }
.logo-alsis.ingame img { height: 30px; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 9995; background: rgba(6,9,15,0.75);
  display: flex; align-items: center; justify-content: center; padding: 2vh 3vw;
}
.modal-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 1rem;
  padding: 1.75rem 2.25rem; display: flex; flex-direction: column; align-items: center; gap: 1.25rem;
}
.modal-icon { font-size: 3.5rem; line-height: 1; }
.modal-actions { display: flex; gap: 1rem; }
.modal-card.settings-card {
  max-width: 34rem; width: 100%; max-height: 94vh; overflow-y: auto;
  align-items: stretch; text-align: left; padding: 1.5rem;
}

/* ---------------- Panel de ajustes (antes admin.html) ---------------- */
.settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
.settings-head h2 { font-size: 1.15rem; font-weight: 700; margin: 0; }
.card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.25rem; }
.card h2 { font-size: 1rem; margin: 0 0 0.75rem; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.6rem; }
.field label { color: var(--text-dim); }
.field input { width: 8rem; font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; padding: 0.4rem 0.6rem; text-align: right; }
.param-grid { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 1rem; align-items: center; }
.param-grid label { color: var(--text-dim); font-size: 0.9rem; }
.param-grid input { width: 7rem; font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 0.4rem; padding: 0.35rem 0.5rem; text-align: right; }
.state-line { font-family: var(--mono); color: var(--text-dim); font-size: 0.9rem; }
.scorebar { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
.scorebar .chip { display: flex; align-items: center; gap: 0.4rem; font-family: var(--mono); font-size: 0.85rem; }
.scorebar .dot { width: 0.9rem; height: 0.9rem; border-radius: 50%; flex-shrink: 0; }

/* Íconos de bola reutilizados en los widgets "sin texto" del panel de ajustes (no son las bolas
   reales del canvas — solo una aproximación en CSS para no meter el motor de dibujo en el modal). */
.ball-swatch { display: inline-block; flex-shrink: 0; position: relative; border-radius: 50%; width: 22px; height: 22px;
  box-shadow: inset -2px -3px 4px rgba(0,0,0,0.35), inset 2px 2px 3px rgba(255,255,255,0.25); }
.ball-swatch.k-neutral { background: radial-gradient(circle at 35% 30%, #b4b8bf, #6f7378); }
.ball-swatch.k-comodin { background: conic-gradient(red,orange,yellow,green,blue,violet,red); }
.ball-swatch.k-comodin::after { content: ""; position: absolute; inset: 3px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #cfd3d8);
  box-shadow: inset -1px -2px 3px rgba(0,0,0,0.2); }
.ball-swatch.k-dorada { background: radial-gradient(circle at 35% 30%, #fde08a, #f7c948);
  box-shadow: inset -2px -3px 4px rgba(0,0,0,0.25), 0 0 8px 2px rgba(247,201,72,0.55); }
.ball-swatch.k-negra { background: radial-gradient(circle at 35% 30%, #3a3a3a, #0c0c0c);
  box-shadow: inset -2px -3px 4px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,255,255,0.85); }

.slider-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.85rem; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-row .slider-val { font-family: var(--mono); color: var(--text-dim); font-size: 0.85rem; min-width: 3.4rem; text-align: right; }
.slider-icon-clock { font-size: 1.25rem; width: 22px; text-align: center; }

.ball-toggle { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.5rem 0.8rem; cursor: pointer;
  flex-shrink: 0; }
.ball-toggle .ball-swatch { width: 30px; height: 30px; }
.ball-toggle-check { font-size: 1.1rem; line-height: 1; }
.neutral-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
.neutral-row .ball-toggle { margin-bottom: 0; }
.value-box-row { display: flex; gap: 0.5rem; flex: 1; min-width: 12rem; }
.value-box { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center;
  gap: 0.4rem; background: var(--panel-2); border: 2px solid var(--border); border-radius: 0.6rem;
  padding: 0.5rem 0.4rem; cursor: pointer; min-height: 2.6rem; }
.value-box.sel { border-color: var(--accent); }
.value-box-label { font-family: var(--mono); color: var(--text-dim); font-size: 0.85rem; }

.special-group { border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.75rem; margin-bottom: 0.85rem; }
.special-group .ball-toggle { margin-bottom: 0.7rem; }

.boca-widget { display: flex; align-items: flex-end; gap: 1.1rem; margin-bottom: 0.85rem; }
.boca-figure { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
.boca-h-slider { width: 160px; accent-color: var(--accent); }
.boca-vcol { width: 34px; height: 108px; position: relative; }
.boca-v-slider {
  position: absolute; top: 50%; left: 50%; width: 100px; height: 8px;
  transform: translate(-50%, -50%) rotate(-90deg); accent-color: var(--accent);
}
.boca-vcol .slider-val { position: absolute; bottom: -1.3rem; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.grow-arrow { font-size: 1.1rem; color: var(--text-dim); flex-shrink: 0; }

.ball-swatch.k-verde { background: radial-gradient(circle at 35% 30%, #8beab0, #2f9e5c); }
.speed-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
.speed-row input[type="range"] { flex: 1; min-width: 6rem; accent-color: var(--accent); }
.speed-box { width: 4.2rem; font: inherit; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 0.4rem; padding: 0.3rem 0.4rem; text-align: center; }
.speed-ineq { font-family: var(--mono); color: var(--text-dim); font-size: 1.1rem; flex-shrink: 0; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay"></div>

  <button id="resetBtn" class="corner-btn" aria-label="Reiniciar">↺</button>
  <button id="soundBtn" class="corner-btn" aria-label="Sonido">🔊</button>
  <button id="settingsBtn" class="corner-btn" aria-label="Ajustes">⚙</button>

  <a id="logoLink" class="logo-alsis" href="https://alsis.com.mx" target="_blank" rel="noopener" aria-label="Alsis Tecnología">
    <img id="logoImg" alt="Alsis Tecnología">
  </a>

  <div id="resetModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-icon">↺</div>
      <div class="modal-actions">
        <button id="resetCancel" class="btn btn-icon" aria-label="Cancelar">✖</button>
        <button id="resetConfirm" class="btn btn-icon btn-danger" aria-label="Confirmar">✅</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal-card settings-card">
      <div class="settings-head">
        <h2>Ajustes</h2>
        <button id="settingsClose" class="btn btn-icon" aria-label="Cerrar">✖</button>
      </div>
      <div id="settingsBody"></div>
    </div>
  </div>

<script>
/* ---------------- Botón de pantalla completa (antes /_shared/fullscreen-button.js) ---------------- */
(function () {
  "use strict";
  var GLYPH_ENTER = "⛶", GLYPH_EXIT = "✕";
  function requestFs() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) { try { var p = fn.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function exitFs() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn) { try { var p = fn.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }
  function build() {
    var btn = document.createElement("button");
    btn.id = "fsBtnCC";
    btn.className = "corner-btn";
    btn.type = "button";
    btn.setAttribute("aria-label", "Pantalla completa");
    btn.textContent = GLYPH_ENTER;
    btn.addEventListener("click", function () { if (isFs()) exitFs(); else requestFs(); });
    document.body.appendChild(btn);
    sync();
  }
  function sync() {
    var btn = document.getElementById("fsBtnCC");
    if (!btn) return;
    var full = isFs();
    btn.textContent = full ? GLYPH_EXIT : GLYPH_ENTER;
    btn.setAttribute("aria-label", full ? "Salir de pantalla completa" : "Pantalla completa");
  }
  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(function (evt) {
    document.addEventListener(evt, sync);
  });
  if (document.body) build(); else document.addEventListener("DOMContentLoaded", build);
})();
</script>

<script>
/* ---------------- Configuración (antes content.js) ----------------
   Defaults + formulario de ajustes. Se quitaron pelotaBotellaTam/botellaDesnivelMax
   (eran exclusivos de la botella de la pared, que esta versión no tiene). */
const CFG_BASE = {
  numRondas: 3,
  duracion: 90,
  pelotasIniciales: 16,
  usarNeutrales: true,        // false = no hay pelotas neutrales en el tablero (ni al inicio ni en el respawn)
  neutralValor: -1,           // efecto en el marcador al capturar una neutral: -1, 0 o +1
  neutralesInicial: 4,
  aumentoPorRonda: 25,
  maxPelotas: 120,
  puntajeInicial: 0,
  pisoEnCero: false,

  radio: 0.020,
  velocidad: 0.26,
  velocidadMin: 0.12,
  velocidadMax: 0.70,
  restitucion: 1.0,
  bahiaProfundidad: 0.06,
  bocaAnchoInicial: 0.22,
  bocaCrecimiento: 0.07,
  usarComodin: true,         // false = el comodín no entra en el sorteo de especiales
  comodinValor: 1,
  pesoComodin: 50,
  maxComodines: 2,
  estrellasComodin: 1,
  usarDorada: true,          // false = la dorada no entra en el sorteo de especiales
  doradaValor: 5,
  pesoDorada: 15,
  maxDoradas: 1,
  estrellasDorada: 5,
  usarNegra: true,           // false = la negra no entra en el sorteo de especiales
  negraValor: 5,
  pesoNegra: 35,
  maxNegras: 2,
  calaverasNegra: 5,
  intervaloEspecial: 8,
  parpadeoDesde: 10,
  parpadeoHzInicial: 1,
  parpadeoHzFinal: 7,
  margenAgarre: 0.020,
  margenInferiorIOS: 0.05,   // franja reservada abajo, solo iOS: evita el gesto de salir de la app
  cronometroTransparencia: 0.85, // 0 = pastel opaco, más = más transparente (alpha del relleno = 1 - esto)

  paleta: ["#e5484d", "#3e63dd", "#30a46c", "#f5a623", "#8e4ec6", "#00a2c7", "#d6409f", "#f76808"],
  colorNeutral: "#8b8f96",
  colorComodin: "#ffffff",
  colorDorada: "#f7c948",
  colorNegra: "#111111",
  colorCuentaRegresiva: "#30a46c" // luces del conteo 3-2-1, se apagan una a una
};

// Los que tienen su propio widget (ver SLIDERS / SPECIALS / BOCA / BOLAS_SESION más abajo, y el
// grupo de neutrales — checkbox + selector de valor + slider, ver renderNeutralBlock) NO están
// aquí — se renderizan aparte, a mano.
const PARAMS = [
  ["numRondas", "Número de rondas", 1, 20, 1, "Sesión"],
  ["puntajeInicial", "Puntaje inicial (colchón)", 0, 500, 5, "Sesión"],
  ["pisoEnCero", "Nunca bajar de 0 (sin negativos)", null, null, null, "Sesión"],

  ["intervaloEspecial", "Intervalo especiales (s)", 2, 60, 1, "Juego"],
  ["parpadeoDesde", "Parpadeo desde (s restantes)", 0, 60, 1, "Juego"],
  ["parpadeoHzInicial", "Parpadeo Hz inicial", 0.2, 10, 0.1, "Juego"],
  ["parpadeoHzFinal", "Parpadeo Hz final", 0.2, 20, 0.1, "Juego"]
];

// Sliders "sin texto": ícono en vez de etiqueta, en vez de un <input type=number>. Mismo campo
// "grupo" que PARAMS, para intercalarse en el lugar correcto del formulario.
// icon: "size" → bola chica/grande en cada extremo; "clock" → reloj a la izquierda; "bounce" →
// trayectoria de rebote punteada; "screenBottom" → pantalla con la franja de abajo marcada;
// "timerFade" → el pastel del cronómetro al 1% y al 90% de opacidad, en cada extremo;
// "emoji:<glyph>" → ese emoji tal cual, a la izquierda. unit se agrega al valor numérico.
const SLIDERS = [
  ["duracion", "clock", 10, 600, 5, "s", "Sesión"],
  ["radio", "size", 0.008, 0.05, 0.001, "", "Juego"],
  ["restitucion", "bounce", 0.5, 1, 0.01, "", "Juego"],
  ["margenAgarre", "emoji:🤏", 0, 0.08, 0.002, "", "Juego"],
  ["margenInferiorIOS", "screenBottom", 0, 0.2, 0.005, "", "Juego"],
  ["cronometroTransparencia", "timerFade", 0, 0.9, 0.05, "", "Juego"]
];

// Bloque "Rapidez": rapidez mínima y máxima como textbox a los lados de un slider (tortuga...
// liebre) para la rapidez base. Sin checkbox — siempre hay velocidad.
const VELOCIDAD = {
  velocidadMin: [0.02, 0.5, 0.01],
  velocidad: [0.05, 0.8, 0.01],
  velocidadMax: [0.2, 1.5, 0.05]
};

// Bloque "Pelotas iniciales" (sesión): pelotasIniciales + aumentoPorRonda + maxPelotas juntos,
// icono+slider cada uno. aumentoPorRonda también escala neutralesInicial (un solo factor
// compartido) aunque el widget de neutrales no repita este control.
const BOLAS_SESION = {
  pelotasIniciales: [2, 300, 1],
  aumentoPorRonda: [0, 200, 5, "%"],
  maxPelotas: [0, 600, 10]
};

// Bloque gráfico de la boca: figura (ancho horizontal + profundidad vertical, en vivo) + slider de
// crecimiento por ronda con par de íconos chico/grande.
const BOCA = {
  bocaAnchoInicial: [0.08, 0.7, 0.01],
  bahiaProfundidad: [0.03, 0.2, 0.005],
  bocaCrecimiento: [0, 0.25, 0.005]
};

// Bloques de especiales (comodín/dorada/negra): mismo tratamiento para los tres — checkbox
// "Usar X" (ícono de esa bola + check) y, si está marcado, valor/peso/máx-en-mesa/ráfaga en un
// solo bloque, icono+slider cada uno. starGlyph es el emoji real que usa spawnBurst() para esa
// bola (💀 negra, ⭐ dorada/comodín), reutilizado aquí como ícono del slider de ráfaga.
const SPECIALS = [
  { kind: "comodin", usar: "usarComodin", valor: "comodinValor", peso: "pesoComodin", max: "maxComodines", star: "estrellasComodin", starGlyph: "⭐",
    valorRange: [1, 20, 1], pesoRange: [0, 100, 1], maxRange: [0, 10, 1], starRange: [0, 20, 1] },
  { kind: "dorada", usar: "usarDorada", valor: "doradaValor", peso: "pesoDorada", max: "maxDoradas", star: "estrellasDorada", starGlyph: "⭐",
    valorRange: [1, 50, 1], pesoRange: [0, 100, 1], maxRange: [0, 10, 1], starRange: [0, 20, 1] },
  { kind: "negra", usar: "usarNegra", valor: "negraValor", peso: "pesoNegra", max: "maxNegras", star: "calaverasNegra", starGlyph: "💀",
    valorRange: [1, 50, 1], pesoRange: [0, 100, 1], maxRange: [0, 10, 1], starRange: [0, 20, 1] }
];
</script>

let CFG = Object.assign({}, CFG_BASE);

// ---------------- Canvas ----------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, minDim = 0;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  minDim = Math.min(W, H);
}
window.addEventListener("resize", resize); resize();

const R = () => CFG.radio * minDim;
const SPEED = () => CFG.velocidad * minDim;
const now = () => performance.now();
// En iOS, el swipe-para-salir (ir al selector de apps) se dispara desde el borde inferior de la
// pantalla — un gesto de sistema que ninguna página puede bloquear. La mitigación es dejar una
// franja sin usar ahí (boca, HUD y rebote de pelotas se corren hacia arriba) para que nadie tenga
// motivo de tocar esa zona mientras juega. Solo en iOS; en otras plataformas no aplica.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const bottomInset = () => isIOS ? CFG.margenInferiorIOS * minDim : 0;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// pisoEnCero es un piso de VISUALIZACIÓN sobre el total acumulado (scoreTotal), no un tope que se
// aplica evento por evento — el número real puede quedar negativo internamente (una racha mala
// dentro de una ronda) y recuperarse solo con futuros aciertos.
const dispTotal = raw => CFG.pisoEnCero ? Math.max(0, raw) : raw;

function hexToRgb(h) {
  h = String(h || "#888").replace("#", "");
  if (h.length === 3) h = h.split("").map(x => x + x).join("");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
const mix = (h, t, a) => { const c = hexToRgb(h); return `rgb(${c.map(v => Math.round(v + (t - v) * a)).join(",")})`; };
const lighten = (h, a) => mix(h, 255, a);
const darken = (h, a) => mix(h, 0, a);
const hexA = (h, a) => { const c = hexToRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const blendHex = (h1, h2, a) => {
  const c1 = hexToRgb(h1), c2 = hexToRgb(h2);
  return "#" + c1.map((v, i) => Math.round(v + (c2[i] - v) * a).toString(16).padStart(2, "0")).join("");
};
// La dorada no tiene un color fijo (chocaba con el amarillo de la paleta de jugadores): recorre y
// mezcla los colores de los jugadores en mesa, para que nunca se lea como "el color de alguien".
function doradaSourceColors() {
  const cols = players.filter(p => p.playing && p.color).map(p => p.color);
  return cols.length ? cols : CFG.paleta;
}
function doradaCycleColor(tMs) {
  const cols = doradaSourceColors(), period = 380, n = cols.length;
  const pos = (tMs / period) % n, idx = Math.floor(pos), frac = pos - idx;
  return blendHex(cols[idx], cols[(idx + 1) % n], frac);
}

// ---------------- Estado ----------------
// Sin "activo/inactivo": el juego arranca directo en la pantalla de configuración de jugadores,
// listo para jugarse — no hay un segundo dispositivo que necesite esperar una señal de arranque.
let phase = "config";      // config | ready | countdown | playing | summary | ended
let round = 1;
let numRondas = CFG.numRondas, pelotasIniciales = CFG.pelotasIniciales,
    neutralesInicial = CFG.neutralesInicial, aumentoPorRonda = CFG.aumentoPorRonda;
let players = mkPlayers();
let balls = [];
let bursts = [];
let tRemaining = 0, countdownT = 0, summaryT = 0;
let blinkPhase = 0, specialAcc = 0;
let lastCountdownBeep = -1, lastTickCycle = -1;
let roundNet = [0, 0, 0, 0];
let tally = mkTally();
let gamePaused = false; // true mientras el modal de Ajustes está abierto: congela el juego
const pointers = new Map();

function mkPlayers() {
  return [0, 1, 2, 3].map(side => ({
    side, joined: false, playing: false, ready: false,
    name: "", color: null, scoreTotal: 0, scoreRound: 0
  }));
}
function mkTally() {
  return [0, 1, 2, 3].map(() => ({ own: 0, others: {}, neutral: 0, comodin: 0, dorada: 0, negra: 0 }));
}
const playingSides = () => players.filter(p => p.playing);

// ---------------- Persistencia local (sobrevive a un refresh accidental) ----------------
// Solo se guarda en fases "seguras" (sin física en curso): si el refresh ocurre a mitad de una
// ronda, se retoma en "ready" para esa misma ronda (con el marcador de rondas ya completadas
// intacto) en vez de tratar de reconstruir la física exacta de las pelotas.
function saveLocal() {
  try {
    const savedPhase = (phase === "playing" || phase === "countdown") ? "ready" : phase;
    localStorage.setItem("colorChaos_state", JSON.stringify({
      CFG, phase: savedPhase, round, players, tally, roundNet
    }));
  } catch {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem("colorChaos_state");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s) return;
    applyCFG(s.CFG || {});
    phase = s.phase || "config";
    round = s.round || 1;
    players = Array.isArray(s.players) ? s.players : mkPlayers();
    tally = Array.isArray(s.tally) ? s.tally : mkTally();
    roundNet = Array.isArray(s.roundNet) ? s.roundNet : [0, 0, 0, 0];
  } catch {}
}
function applyCFG(partial) {
  CFG = Object.assign({}, CFG_BASE, partial || {});
  numRondas = CFG.numRondas; pelotasIniciales = CFG.pelotasIniciales;
  neutralesInicial = CFG.neutralesInicial; aumentoPorRonda = CFG.aumentoPorRonda;
}

// ---------------- Transiciones ----------------
function tryReady() {
  const ps = playingSides();
  if (ps.length >= 2 && ps.every(p => p.ready)) enterReady();
  else updateOverlay();
}
function enterReady() {
  phase = "ready";
  updateOverlay();
}
function startRound() {
  initAudio();
  phase = "countdown"; countdownT = 3; tRemaining = CFG.duracion;
  lastCountdownBeep = -1;
  updateOverlay();
}
function beginPlaying() {
  phase = "playing";
  tRemaining = CFG.duracion; blinkPhase = 0; specialAcc = 0; lastTickCycle = -1;
  playGoSound();
  tally = mkTally();
  players.forEach(p => p.scoreRound = 0);
  // Colchón contra negativos: se aplica una sola vez, al arrancar la ronda 1 (no en cada ronda).
  if (round === 1 && CFG.puntajeInicial) playingSides().forEach(p => p.scoreTotal = (p.scoreTotal || 0) + CFG.puntajeInicial);
  spawnInitialBalls();
  updateOverlay();
}
function endRound() {
  roundNet = players.map(p => p.scoreRound || 0);
  players.forEach(p => { p.scoreTotal = (p.scoreTotal || 0) + (p.scoreRound || 0); p.scoreRound = 0; });
  balls = [];
  phase = "summary"; summaryT = 15;
  playEndSound();
  updateOverlay();
}
function afterSummary() {
  if (round < numRondas) { round++; phase = "ready"; }
  else { phase = "ended"; }
  updateOverlay();
}
// Reinicio rápido (botón de la esquina): vuelve a la pantalla de configuración manteniendo CFG.
function reiniciarRapido() {
  players = mkPlayers(); round = 1; balls = []; bursts = []; tally = mkTally();
  phase = "config";
  updateOverlay();
}

// ---------------- Pelotas ----------------
function makeBall(kind, color) {
  const sp = SPEED(), a = Math.random() * Math.PI * 2;
  return {
    kind, color,
    x: W * (0.30 + Math.random() * 0.40), y: H * (0.30 + Math.random() * 0.40),
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, held: false, dragVX: 0, dragVY: 0
  };
}
const colorBall = c => makeBall("color", c);
const neutralBall = () => makeBall("neutral", CFG.colorNeutral);
function specialBall(kind) {
  const col = kind === "comodin" ? CFG.colorComodin : kind === "dorada" ? CFG.colorDorada : CFG.colorNegra;
  return makeBall(kind, col);
}
function spawnInitialBalls() {
  balls = [];
  const ps = playingSides();
  const factor = Math.pow(1 + aumentoPorRonda / 100, round - 1);
  const nColor = Math.max(ps.length, Math.round(pelotasIniciales * factor));
  const nNeutral = CFG.usarNeutrales ? Math.round(neutralesInicial * factor) : 0;
  for (let k = 0; k < nColor; k++) balls.push(colorBall(ps[k % ps.length].color));
  for (let k = 0; k < nNeutral; k++) balls.push(neutralBall());
}
function respawnPositive() {
  if (CFG.maxPelotas > 0 && balls.length >= CFG.maxPelotas) return;
  playingSides().forEach(p => balls.push(colorBall(p.color)));
  if (CFG.usarNeutrales) balls.push(neutralBall());
}
function trySpawnSpecial() {
  if (CFG.maxPelotas > 0 && balls.length >= CFG.maxPelotas) return;
  const cnt = { comodin: 0, dorada: 0, negra: 0 };
  balls.forEach(b => { if (cnt[b.kind] != null) cnt[b.kind]++; });
  const pool = [];
  if (CFG.usarComodin && cnt.comodin < CFG.maxComodines) for (let i = 0; i < CFG.pesoComodin; i++) pool.push("comodin");
  if (CFG.usarDorada && cnt.dorada < CFG.maxDoradas) for (let i = 0; i < CFG.pesoDorada; i++) pool.push("dorada");
  if (CFG.usarNegra && cnt.negra < CFG.maxNegras) for (let i = 0; i < CFG.pesoNegra; i++) pool.push("negra");
  if (pool.length) balls.push(specialBall(pool[Math.floor(Math.random() * pool.length)]));
}

function bocaPx(side) {
  const b = (CFG.bocaAnchoInicial + (round - 1) * CFG.bocaCrecimiento) * minDim;
  const edge = (side % 2 === 0) ? W : H;
  return Math.max(minDim * 0.05, Math.min(b, edge - 4 * R()));
}
function inBay(b, side) {
  const a = bocaPx(side) / 2, depth = CFG.bahiaProfundidad * minDim;
  let lx, ly;
  if (side === 0) { lx = b.x - W / 2; ly = b.y; }
  else if (side === 2) { lx = b.x - W / 2; ly = (H - bottomInset()) - b.y; }
  else if (side === 1) { lx = b.y - H / 2; ly = W - b.x; }
  else { lx = b.y - H / 2; ly = b.x; }
  return ly >= 0 && (lx * lx) / (a * a) + (ly * ly) / (depth * depth) <= 1;
}

function consume(i, side) {
  const b = balls[i], p = players[side], t = tally[side];
  let delta = 0;
  if (b.kind === "color") {
    if (b.color === p.color) { delta = 1; t.own++; }
    else {
      delta = -1;
      const owner = players.find(q => q.playing && q.color === b.color);
      const key = owner ? owner.side : "x";
      t.others[key] = (t.others[key] || 0) + 1;
    }
  } else if (b.kind === "neutral") { delta = CFG.neutralValor; t.neutral++; }
  else if (b.kind === "comodin") { delta = CFG.comodinValor; t.comodin++; }
  else if (b.kind === "dorada") { delta = CFG.doradaValor; t.dorada++; }
  else { delta = -CFG.negraValor; t.negra++; }

  p.scoreRound = (p.scoreRound || 0) + delta;
  playScoreSound(delta > 0);
  spawnBurst(side, b.kind);
  for (const ptr of pointers.values()) if (ptr.ball === b) ptr.ball = null;
  balls.splice(i, 1);
  if (delta > 0) respawnPositive();
  // Una pelota de color que cae en una bahía ajena no dispara el respawn "positivo" (que crece
  // el tablero), pero si nadie la repone, ese color puede terminar agotado en la mesa. Se
  // regenera SOLO la que acaba de entrar (una, no las cuatro).
  else if (b.kind === "color" && (CFG.maxPelotas <= 0 || balls.length < CFG.maxPelotas)) {
    balls.push(colorBall(b.color));
  }
}

// ---------------- Física ----------------
function step(dt) {
  const r = R();
  const vmax = CFG.velocidadMax * minDim, vmin = CFG.velocidadMin * minDim;

  // mover pelotas sostenidas hacia su dedo; su "velocidad de arrastre" alimenta los choques
  for (const ptr of pointers.values()) {
    if (!ptr.ball) continue;
    const b = ptr.ball;
    const ox = b.x, oy = b.y;
    const dx = ptr.x - b.x, dy = ptr.y - b.y, d = Math.hypot(dx, dy) || 1;
    const mv = Math.min(d, r * 0.9);
    b.x += dx / d * mv; b.y += dy / d * mv;
    let dvx = (b.x - ox) / dt, dvy = (b.y - oy) / dt;
    const ds = Math.hypot(dvx, dvy);
    if (ds > vmax) { dvx = dvx / ds * vmax; dvy = dvy / ds * vmax; }
    b.dragVX = dvx; b.dragVY = dvy;
  }
  // integrar libres
  for (const b of balls) if (!b.held) { b.x += b.vx * dt; b.y += b.vy * dt; }

  // consumo por bahías (cualquier pelota, sostenida o no)
  const ps = playingSides();
  for (let i = balls.length - 1; i >= 0; i--) {
    for (const p of ps) { if (inBay(balls[i], p.side)) { consume(i, p.side); break; } }
  }
  // pelota–pelota
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
      const min = r * 2;
      if (dist === 0) { dx = 1; dy = 0; dist = 0.01; }
      if (dist < min) {
        const nx = dx / dist, ny = dy / dist, overlap = min - dist;
        if (a.held && b.held) { /* nada */ }
        else if (a.held) { b.x += nx * overlap; b.y += ny * overlap; }
        else if (b.held) { a.x -= nx * overlap; a.y -= ny * overlap; }
        else { a.x -= nx * overlap / 2; a.y -= ny * overlap / 2; b.x += nx * overlap / 2; b.y += ny * overlap / 2; }
        const e = CFG.restitucion;
        const aN = a.held ? ((a.dragVX || 0) * nx + (a.dragVY || 0) * ny) : (a.vx * nx + a.vy * ny);
        const bN = b.held ? ((b.dragVX || 0) * nx + (b.dragVY || 0) * ny) : (b.vx * nx + b.vy * ny);
        if (a.held && b.held) {
          // nada
        } else if (a.held) {
          // choque contra masa "infinita" que se mueve a la velocidad del arrastre
          const bNew = (1 + e) * aN - e * bN;
          b.vx += (bNew - bN) * nx; b.vy += (bNew - bN) * ny;
        } else if (b.held) {
          const aNew = (1 + e) * bN - e * aN;
          a.vx += (aNew - aN) * nx; a.vy += (aNew - aN) * ny;
        } else {
          // masas iguales: intercambian la componente normal (con restitución)
          const imp = (aN - bN) * e;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }
  // paredes (el piso se acorta en iOS: franja reservada abajo, ver bottomInset())
  const floorY = H - bottomInset();
  for (const b of balls) {
    if (b.held) { b.x = Math.max(r, Math.min(W - r, b.x)); b.y = Math.max(r, Math.min(floorY - r, b.y)); continue; }
    if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx) * CFG.restitucion; }
    if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx) * CFG.restitucion; }
    if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy) * CFG.restitucion; }
    if (b.y > floorY - r) { b.y = floorY - r; b.vy = -Math.abs(b.vy) * CFG.restitucion; }
  }
  // sin fricción: solo se acota la rapidez entre vmin y vmax (mantiene movimiento perpetuo)
  for (const b of balls) {
    if (b.held) continue;
    let s = Math.hypot(b.vx, b.vy);
    if (s < 1e-4) { const a = Math.random() * Math.PI * 2; b.vx = Math.cos(a) * vmin; b.vy = Math.sin(a) * vmin; s = vmin; }
    if (s < vmin) { b.vx = b.vx / s * vmin; b.vy = b.vy / s * vmin; }
    else if (s > vmax) { b.vx = b.vx / s * vmax; b.vy = b.vy / s * vmax; }
  }
  // especiales por temporizador
  specialAcc += dt;
  if (specialAcc >= CFG.intervaloEspecial) { specialAcc = 0; trySpawnSpecial(); }
}

// ---------------- Ráfagas (calaveras / estrellas) ----------------
function spawnBurst(side, kind) {
  let glyph = null, n = 0;
  if (kind === "negra") { glyph = "💀"; n = CFG.calaverasNegra; }
  else if (kind === "dorada") { glyph = "⭐"; n = CFG.estrellasDorada; }
  else if (kind === "comodin") { glyph = "⭐"; n = CFG.estrellasComodin; }
  if (!glyph || n <= 0) return;
  const depth = CFG.bahiaProfundidad * minDim;
  let ox, oy, nx, ny;
  if (side === 0) { ox = W / 2; oy = depth * 0.3; nx = 0; ny = 1; }
  else if (side === 2) { ox = W / 2; oy = H - depth * 0.3; nx = 0; ny = -1; }
  else if (side === 1) { ox = W - depth * 0.3; oy = H / 2; nx = -1; ny = 0; }
  else { ox = depth * 0.3; oy = H / 2; nx = 1; ny = 0; }
  const base = Math.atan2(ny, nx);
  for (let i = 0; i < n; i++) {
    const ang = base + (Math.random() - 0.5) * 1.4;
    const spd = minDim * (0.12 + Math.random() * 0.10);
    bursts.push({ x: ox, y: oy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1.3, max: 1.3, glyph, rot: Math.random() * 6.28 });
  }
}
function updateBursts(dt) {
  for (const p of bursts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; p.rot += dt * 3; }
  bursts = bursts.filter(p => p.life > 0);
}

// ---------------- Render ----------------
// Se pierde entre tantas pelotas si solo brilla del mismo tono que puede tocarle a un jugador —
// un halo que se desvanece a transparente la distingue sin importar el color. Compartido entre el
// canvas real (drawBall) y los mini-canvas de demo/resumen (drawBallAt) para que se vea igual.
function drawDoradaHalo(c, x, y, r, col) {
  const glowT = 1.1 + 0.6 * Math.sin(now() / 160);
  const rHalo = r * 2.2 * (0.85 + 0.15 * glowT);
  const halo = c.createRadialGradient(x, y, 0, x, y, rHalo);
  halo.addColorStop(0, hexA(col, 0.55));
  halo.addColorStop(1, hexA(col, 0));
  c.beginPath(); c.arc(x, y, rHalo, 0, 7);
  c.fillStyle = halo; c.fill();
  return glowT;
}
function drawBall(b) {
  const r = R();
  const col = b.kind === "dorada" ? doradaCycleColor(now()) : b.color;
  if (b.kind === "dorada") drawDoradaHalo(ctx, b.x, b.y, r, col);
  const g = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
  g.addColorStop(0, lighten(col, 0.55));
  g.addColorStop(0.55, col);
  g.addColorStop(1, darken(col, 0.35));
  ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7);
  if (b.kind === "dorada") { ctx.shadowColor = col; ctx.shadowBlur = r * (1.1 + 0.6 * Math.sin(now() / 160)); }
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  if (b.kind === "negra") { ctx.lineWidth = Math.max(2, r * 0.18); ctx.strokeStyle = "#fff"; ctx.stroke(); }
  if (b.kind === "comodin") {
    const cols = CFG.paleta, n = cols.length;
    ctx.lineWidth = Math.max(2, r * 0.24);
    for (let i = 0; i < n; i++) {
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.96, i / n * 6.283, (i + 1) / n * 6.283);
      ctx.strokeStyle = cols[i]; ctx.stroke();
    }
  }
  if (b.held) { ctx.beginPath(); ctx.arc(b.x, b.y, r * 1.25, 0, 7); ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; ctx.stroke(); }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Cada lado que juega: pared del color del jugador con un HUECO = la boca (media elipse hacia
// el campo). La boca arranca angosta y crece cada ronda. Solo por ahí entran las pelotas.
function drawBay(side) {
  const p = players[side], a = bocaPx(side) / 2, depth = CFG.bahiaProfundidad * minDim;
  const T = Math.max(5, R() * 0.7);
  const floorY = H - bottomInset(); // en iOS, el lado inferior se corre hacia arriba
  ctx.save();

  // pared en dos tramos, con el hueco de la boca en medio
  ctx.fillStyle = hexA(p.color, 0.92);
  if (side === 0 || side === 2) {
    const y = side === 0 ? 0 : floorY - T, cx = W / 2;
    ctx.fillRect(0, y, cx - a, T);
    ctx.fillRect(cx + a, y, W - (cx + a), T);
  } else {
    const x = side === 1 ? W - T : 0, cy = H / 2;
    ctx.fillRect(x, 0, T, cy - a);
    ctx.fillRect(x, cy + a, T, H - (cy + a));
  }

  else if (side === 2) ctx.ellipse(W / 2, floorY, a, depth, 0, Math.PI, 2 * Math.PI);
  else if (side === 1) ctx.ellipse(W, H / 2, depth, a, 0, Math.PI / 2, 3 * Math.PI / 2);
  else ctx.ellipse(0, H / 2, depth, a, 0, -Math.PI / 2, Math.PI / 2);
  ctx.fillStyle = hexA(p.color, 0.20); ctx.fill();

}

  const pad = depth + F * (showTimer ? 2.6 : 1.9);
  let ax, ay, rot;
  if (side === 0) { ax = W / 2; ay = pad; rot = Math.PI; }
  else if (side === 2) { ax = W / 2; ay = (H - bottomInset()) - pad; rot = 0; }
  else if (side === 1) { ax = W - pad; ay = H / 2; rot = -Math.PI / 2; }
  else { ax = pad; ay = H / 2; rot = Math.PI / 2; }

  ctx.save(); ctx.translate(ax, ay); ctx.rotate(rot);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const wChip = F * 6.6, hChip = showTimer ? F * 3.6 : F * 2.5;
  ctx.fillStyle = "rgba(8,11,17,0.72)"; roundRect(-wChip / 2, -hChip / 2, wChip, hChip, F * 0.4); ctx.fill();

  ctx.fillStyle = "#fff"; ctx.font = `800 ${F * 1.45}px system-ui, sans-serif`;
  ctx.fillText((sr < 0 ? "−" : "") + Math.abs(sr), 0, showTimer ? -F * 0.05 : F * 0.2);
  if (showTimer) {
    ctx.fillStyle = tRemaining <= CFG.parpadeoDesde ? "#ff8f7a" : "rgba(255,255,255,0.85)";
    ctx.font = `800 ${F * 0.95}px ui-monospace, monospace`;
    ctx.fillText("⏱ " + Math.max(0, Math.ceil(tRemaining)), 0, hChip / 2 - F * 0.7);

function drawCenter(big, sub) {
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.font = `800 ${minDim * 0.16}px system-ui, sans-serif`;
  ctx.fillText(big, W / 2, H / 2 - minDim * 0.02);
  if (sub) { ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = `600 ${minDim * 0.035}px system-ui, sans-serif`; ctx.fillText(sub, W / 2, H / 2 + minDim * 0.09); }
  ctx.restore();
}
// Cronómetro central de ronda: pastel radial que se vacía en sentido horario desde las 12.
// Sin texto (a diferencia de un número, se lee igual sin importar desde qué lado de la mesa se
// mire); el segundo exacto ya lo muestra el HUD de cada bahía, orientado hacia su jugador.
function drawRoundTimer() {
  const frac = CFG.duracion > 0 ? Math.max(0, Math.min(1, tRemaining / CFG.duracion)) : 0;
  const urgent = tRemaining <= CFG.parpadeoDesde;
  const alpha = 1 - Math.max(0, Math.min(0.95, CFG.cronometroTransparencia));
  const R = minDim * 0.13;

  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
  if (frac > 0) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.closePath();

    ctx.fill();

}
// Conteo 3-2-1 gráfico: 3 luces que empiezan encendidas y se apagan una a una (de izquierda a

  const n = 3, R = minDim * 0.045, gap = R * 2.7;
  ctx.save(); ctx.translate(W / 2 - gap, H / 2);

    const lit = i >= (n - shown);
    ctx.beginPath(); ctx.arc(i * gap, 0, R, 0, Math.PI * 2);
    if (lit) {
      ctx.shadowColor = CFG.colorCuentaRegresiva; ctx.shadowBlur = R * 1.4;
      ctx.fillStyle = CFG.colorCuentaRegresiva;

    }
    ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = Math.max(2, R * 0.15);

function render() {
  ctx.clearRect(0, 0, W, H);

  // marco
  ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, (H - bottomInset()) - 2);

  if (phase === "playing" || phase === "countdown" || phase === "summary" || phase === "ended") {
    playingSides().forEach(p => drawBay(p.side));
  }
  for (const b of balls) drawBall(b);
  // ráfagas
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of bursts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.font = `${minDim * 0.05}px system-ui, sans-serif`;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillText(p.glyph, 0, 0); ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha = 1;

  if (phase === "playing" || phase === "countdown" || phase === "summary" || phase === "ended") {
    playingSides().forEach(p => drawBayHUD(p.side));
  }
  if (phase === "playing") drawRoundTimer();
  if (phase === "countdown") drawCountdownLights(Math.max(1, Math.ceil(countdownT)));
  if (phase === "summary") {
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.font = `800 ${minDim * 0.05}px system-ui, sans-serif`;
    ctx.fillText("📊 " + round + "/" + numRondas, W / 2, H / 2 - minDim * 0.03);
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = `600 ${minDim * 0.03}px system-ui, sans-serif`;
    ctx.fillText((round < numRondas ? "⏭ " : "🏁 ") + Math.max(0, Math.ceil(summaryT)), W / 2, H / 2 + minDim * 0.02);
    ctx.restore();
  }
  if (phase === "ended") {
    const ps = playingSides().slice().sort((a, b) => (b.scoreTotal || 0) - (a.scoreTotal || 0));
    const top = ps[0]; const tie = ps.length > 1 && (ps[1].scoreTotal || 0) === (top.scoreTotal || 0);
    drawCenter(tie ? "🤝" : "🏆 " + (top.name || "Jugador " + (top.side + 1)), tie ? "" : String(dispTotal(top.scoreTotal || 0)));
  }

  // parpadeo del área en los últimos segundos
  if (phase === "playing" && tRemaining <= CFG.parpadeoDesde) {
    const a = 0.12 * (0.5 + 0.5 * Math.sin(blinkPhase));
    ctx.fillStyle = `rgba(229,85,61,${a})`; ctx.fillRect(0, 0, W, H);

// ---------------- Loop ----------------
let last = now();
function loop() {
  const t = now(); let dt = (t - last) / 1000; last = t;
  dt = Math.max(0, Math.min(dt, 1 / 30));

  if (!gamePaused) {
    if (phase === "countdown") {
      const shown = Math.max(1, Math.ceil(countdownT));
      if (shown !== lastCountdownBeep) { lastCountdownBeep = shown; playCountdownBeep(); }
      countdownT -= dt; if (countdownT <= 0) beginPlaying();
    }
    else if (phase === "playing") {
      step(dt); updateBursts(dt);
      tRemaining -= dt;
      if (tRemaining <= CFG.parpadeoDesde) {
        const frac = 1 - Math.max(0, tRemaining) / CFG.parpadeoDesde;
        const hz = CFG.parpadeoHzInicial + (CFG.parpadeoHzFinal - CFG.parpadeoHzInicial) * frac;
        blinkPhase += dt * hz * Math.PI * 2;
        const cycle = Math.floor(blinkPhase / (Math.PI * 2));
        if (cycle !== lastTickCycle) { lastTickCycle = cycle; playWarnTick(); }
      }
      if (tRemaining <= 0) endRound();
    } else if (phase === "summary") { updateBursts(dt); summaryT -= dt; if (summaryT <= 0) afterSummary(); }
    else if (phase === "config") { demoT += dt; paintAllDemos(); }
    else updateBursts(dt);
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------------- Entrada táctil ----------------
// user-scalable=no en el <meta viewport> no basta: iOS moderno lo ignora para un pinch real (dos
// dedos, incluso de personas distintas jalando pelotas al mismo tiempo). gesturestart/gesturechange
// son eventos propios de Safari para ese gesto; el touchmove con 2+ dedos es el respaldo general.
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

function toXY(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener("pointerdown", e => {
  if (phase !== "playing" || gamePaused) return;
  const { x, y } = toXY(e); const grab = R() + CFG.margenAgarre * minDim;
  let best = null, bd = grab;
  for (const b of balls) { if (b.held) continue; const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = b; } }
  if (!best) return;
  best.held = true; best.dragVX = 0; best.dragVY = 0;
  pointers.set(e.pointerId, { ball: best, x, y, lastX: x, lastY: y });
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});

  const p = pointers.get(e.pointerId); if (!p) return;
  const { x, y } = toXY(e); p.lastX = p.x; p.lastY = p.y; p.x = x; p.y = y;
});

  const p = pointers.get(e.pointerId); if (!p) return;
  const b = p.ball;
  if (b) {
    b.held = false;
    const vmax = CFG.velocidadMax * minDim, vmin = CFG.velocidadMin * minDim, base = SPEED();
    let vx = b.dragVX || 0, vy = b.dragVY || 0;
    let s = Math.hypot(vx, vy);
    if (s < vmin) {
      // arrastre lento o quieto: sale a la velocidad base en la última dirección del dedo
      let dx = p.x - p.lastX, dy = p.y - p.lastY, dd = Math.hypot(dx, dy);
      if (dd < 1) { const a = Math.random() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); dd = 1; }
      vx = dx / dd * base; vy = dy / dd * base;
    } else if (s > vmax) { vx = vx / s * vmax; vy = vy / s * vmax; }
    b.vx = vx; b.vy = vy; b.dragVX = 0; b.dragVY = 0;
  }
  pointers.delete(e.pointerId);
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);

// ---------------- Overlay DOM ----------------

function bindConfig() {

    if (act === "name") {

function drawBallAt(c, x, y, r, kind, color) {
  const col = kind === "neutral" ? CFG.colorNeutral : kind === "comodin" ? CFG.colorComodin
            : kind === "dorada" ? doradaCycleColor(now()) : kind === "negra" ? CFG.colorNegra : (color || "#888");
  let glowT;
  if (kind === "dorada") glowT = drawDoradaHalo(c, x, y, r, col);
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);

  if (kind === "negra") { c.lineWidth = Math.max(1.5, r * 0.2); c.strokeStyle = "#fff"; c.stroke(); }
  if (kind === "comodin") {
    const cols = CFG.paleta, n = cols.length; c.lineWidth = Math.max(1.5, r * 0.28);
    for (let i = 0; i < n; i++) { c.beginPath(); c.arc(x, y, r * 0.9, i / n * 6.283, (i + 1) / n * 6.283); c.strokeStyle = cols[i]; c.stroke(); }
  }

  cv.width = S * dpr; cv.height = S * dpr; cv.style.width = S + "px"; cv.style.height = S + "px";
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBallAt(c, S / 2, S / 2, S / 2 - 2, kind, color);

// ---------------- Demo de reglas (solo durante "config") ----------------
// Animación decorativa embebida en cada panel de config: boca + pelota entrando + puntuación,
// recorriendo un ciclo fijo (propio +1, ajeno -1, comodín, neutral, dorada, negra) y reiniciando.
let demoT = 0;
const DEMO_FLY = 0.9, DEMO_HOLD = 0.6, DEMO_END_PAUSE = 1.2;
function demoSteps() {
  const steps = [
    { kind: "color", sign: "own", delta: 1 },
    { kind: "color", sign: "other", delta: -1 },
  ];
  if (CFG.usarComodin) steps.push({ kind: "comodin", delta: CFG.comodinValor });
  if (CFG.usarNeutrales) steps.push({ kind: "neutral", delta: CFG.neutralValor });
  if (CFG.usarDorada) steps.push({ kind: "dorada", delta: CFG.doradaValor });
  if (CFG.usarNegra) steps.push({ kind: "negra", delta: -CFG.negraValor });
  return steps;
}
function demoState(t) {
  const steps = demoSteps(), dur = DEMO_FLY + DEMO_HOLD;
  const cycle = steps.length * dur + DEMO_END_PAUSE;
  let tt = ((t % cycle) + cycle) % cycle, active = -1, localT = 0;
  for (let i = 0; i < steps.length; i++) {
    if (tt < dur) { active = i; localT = tt; break; }
    tt -= dur;
  }
  return { steps, active, localT };
}
function paintDemo(cv, side) {
  const c = cv.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio || 1), Wc = 176, Hc = 60;
  if (cv.width !== Math.round(Wc * dpr)) {
    cv.width = Wc * dpr; cv.height = Hc * dpr; cv.style.width = Wc + "px"; cv.style.height = Hc + "px";
  }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, Wc, Hc);

  const p = players[side];
  const ownColor = (p.playing && p.color) ? p.color : CFG.paleta[side % CFG.paleta.length];
  const taken = players.filter(q => q.playing).map(q => q.color).concat(ownColor);
  const otherColor = CFG.paleta.find(x => !taken.includes(x)) || CFG.paleta[(side + 1) % CFG.paleta.length];

  const st = demoState(demoT);
  const stepIdx = st.active >= 0 ? st.active : st.steps.length - 1;
  const step = st.steps[stepIdx];
  const localT = st.active >= 0 ? st.localT : (DEMO_FLY + DEMO_HOLD);
  const ballColor = step.kind === "color" ? (step.sign === "own" ? ownColor : otherColor) : null;

  // pared con hueco = la boca (misma metáfora visual que en el juego real)
  const cx = Wc / 2, wallY = Hc - 8, gapHalf = 20;
  c.fillStyle = hexA(ownColor, 0.85);
  c.fillRect(0, wallY - 3, cx - gapHalf, 6);
  c.fillRect(cx + gapHalf, wallY - 3, Wc - (cx + gapHalf), 6);
  c.beginPath(); c.ellipse(cx, wallY, gapHalf, 9, 0, 0, Math.PI);
  c.fillStyle = hexA(ownColor, 0.18); c.fill();
  c.strokeStyle = ownColor; c.lineWidth = 2; c.stroke();

  if (localT < DEMO_FLY) {
    // pelota volando hacia la boca
    const frac = localT / DEMO_FLY;
    drawBallAt(c, cx, 6 + frac * (wallY - 10), 8, step.kind, ballColor);
  } else {
    // recién llegó: la puntuación sale de la boca flotando y se desvanece
    const frac = Math.min(1, (localT - DEMO_FLY) / DEMO_HOLD);
    const label = (step.delta > 0 ? "+" : "−") + Math.abs(step.delta);
    c.globalAlpha = 1 - frac;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.font = "800 22px system-ui, sans-serif";
    c.fillStyle = step.delta > 0 ? "#35c26a" : "#e5533d";
    c.fillText(label, cx, wallY - 8 - frac * 26);
    c.globalAlpha = 1;
  }
}
function paintAllDemos() {
  overlay.querySelectorAll("canvas.demo-ico").forEach(cv => paintDemo(cv, +cv.dataset.side));
}
function renderSummary() {
  const iconsFor = p => {
    const t = tally[p.side], out = [{ kind: "color", color: p.color, n: t.own, sign: "+" }];
    players.filter(q => q.playing && q.side !== p.side).forEach(op => {
      const n = t.others[op.side] || 0;
      if (n) out.push({ kind: "color", color: op.color, n, sign: "−" });
    });
    if (t.neutral) out.push({ kind: "neutral", n: t.neutral, sign: CFG.neutralValor >= 0 ? "+" : "−" });
    if (t.dorada) out.push({ kind: "dorada", n: t.dorada, sign: "+" });
    if (t.comodin) out.push({ kind: "comodin", n: t.comodin, sign: "+" });
    if (t.negra) out.push({ kind: "negra", n: t.negra, sign: "−" });
    return out;
  };

// ---------------- Sonido ----------------
let audioCtx = null;
function initAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch {} }

let soundOn = true;
try { soundOn = localStorage.getItem("colorChaos_sound") !== "off"; } catch {}
const soundBtn = document.getElementById("soundBtn");
function updateSoundBtn() {
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  soundBtn.setAttribute("aria-label", soundOn ? "Sonido activado" : "Sonido silenciado");
}
soundBtn.onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("colorChaos_sound", soundOn ? "on" : "off"); } catch {}
  updateSoundBtn();
};
updateSoundBtn();

// Un solo tono simple; el resto de los efectos son secuencias de llamadas a este helper.
function playTone(freq, offset, dur, type, peak) {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + offset;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// Suma/resta puntos: un salto de dos notas hacia arriba o hacia abajo, sin distinguir tipo de
// pelota (comodín/dorada suenan igual que un acierto propio; negra/neutral igual que ajeno).
function playScoreSound(positive) {
  const [f1, f2] = positive ? [523, 784] : [523, 349];
  playTone(f1, 0,    0.09, "square", 0.16);
  playTone(f2, 0.07, 0.10, "square", 0.16);
}
// Tic de advertencia — se llama una vez por ciclo de parpadeo (ver loop()), así la tensión sonora
// crece junto con la visual (parpadeoHzInicial → parpadeoHzFinal).
function playWarnTick() { playTone(1200, 0, 0.05, "square", 0.14); }
// Beeper de cuenta regresiva: un beep por número (3, 2, 1) — ver loop() — y un tono distinto,
// más largo y agudo, al arrancar la ronda.
function playCountdownBeep() { playTone(660, 0, 0.12, "square", 0.22); }
function playGoSound() { playTone(1320, 0, 0.25, "square", 0.26); }
// Fin de ronda: alarma (pulsos repetidos al mismo tono).
function playEndSound() {
  [0, 0.18, 0.36, 0.54].forEach(dt => playTone(880, dt, 0.14, "sawtooth", 0.28));
}

// Lee un <input type=range id="s_<key>"> acotado a `range` ([min,max,...]); CFG[key] si no existe.
function readSliderEl(key, range) {
  const el = document.getElementById("s_" + key);
  let v = el ? parseFloat(el.value) : CFG[key];
  if (!Number.isFinite(v)) v = CFG[key];

    if (st === null) { out[k] = el.checked; return; }
    let v = parseFloat(el.value);
    if (!Number.isFinite(v)) v = CFG[k];

    if (mx != null) v = Math.min(mx, v);

  });
  SLIDERS.forEach(([k, , mn, mx]) => { out[k] = readSliderEl(k, [mn, mx]); });
  out.velocidadMin = readNumberEl("velocidadMin", VELOCIDAD.velocidadMin);
  out.velocidad = readSliderEl("velocidad", VELOCIDAD.velocidad);
  out.velocidadMax = readNumberEl("velocidadMax", VELOCIDAD.velocidadMax);
  Object.keys(BOLAS_SESION).forEach(k => { out[k] = readSliderEl(k, BOLAS_SESION[k]); });
  Object.keys(BOCA).forEach(k => { out[k] = readSliderEl(k, BOCA[k]); });
  SPECIALS.forEach(spec => {
    out[spec.usar] = curUsarSpecial[spec.usar];
    out[spec.valor] = readSliderEl(spec.valor, spec.valorRange);
    out[spec.peso] = readSliderEl(spec.peso, spec.pesoRange);
    out[spec.max] = readSliderEl(spec.max, spec.maxRange);
    out[spec.star] = readSliderEl(spec.star, spec.starRange);
  });
  out.usarNeutrales = curUsarNeutrales;
  out.neutralValor = curNeutralValor;
  out.neutralesInicial = readSliderEl("neutralesInicial", [1, 20]);
  return out;
}
// No hay concepto de "activo/inactivo" — sin un segundo dispositivo esperando esa señal, no
// aporta nada más que un paso extra. El juego siempre está listo para jugarse; Ajustes es un
// panel opcional (Guardar / Reiniciar partida), no una puerta obligatoria.
function reiniciarPartida() {
  applyCFG(readParamsFromForm());
  round = 1; phase = "config";
  players = mkPlayers(); balls = []; bursts = []; tally = mkTally();
  updateOverlay();
}
function renderSettings() {
  curUsarNeutrales = !!CFG.usarNeutrales;
  curNeutralValor = CFG.neutralValor;
  curNeutralesInicial = Math.max(1, Math.min(20, CFG.neutralesInicial || 4));
  SPECIALS.forEach(spec => { curUsarSpecial[spec.usar] = !!CFG[spec.usar]; });
  const scoreChips = playingSides().map(p => `
    <span class="chip"><span class="dot" style="background:${esc(p.color || "#555")}"></span>
      ${esc(p.name || ("Lado " + (p.side + 1)))}: ${dispTotal((p.scoreTotal || 0) + (p.scoreRound || 0))}</span>`).join("") || "<span class='state-line'>sin jugadores aún</span>";
  document.getElementById("settingsBody").innerHTML = `
    <div class="card">
      <h2>Control</h2>
      <p class="state-line">Estado: ${phase} · ronda ${round}/${CFG.numRondas}</p>
      <div class="scorebar">${scoreChips}</div>
      <div class="field" style="margin-top:1rem;justify-content:flex-start;gap:0.6rem;flex-wrap:wrap">
        <button class="btn btn-primary" id="stReiniciar">Reiniciar partida</button>
        <button class="btn" id="stGuardar">Guardar parámetros</button>
      </div>
    </div>
    <div class="card">
      <h2>Parámetros del juego</h2>
      <p class="state-line">«Guardar» aplica los cambios sin interrumpir la partida en curso (se notan en la próxima ronda); «Reiniciar partida» además vuelve a la pantalla de configuración de jugadores.</p>
      ${paramFormHtml()}
      <div class="actions" style="display:flex;gap:0.6rem;margin-top:1.25rem;flex-wrap:wrap">
        <button class="btn" id="stDefaults">Restaurar valores por defecto</button>
      </div>
    </div>`;
  document.getElementById("stReiniciar").onclick = () => { reiniciarPartida(); closeSettings(); };
  document.getElementById("stGuardar").onclick = () => { applyCFG(readParamsFromForm()); saveLocal(); renderSettings(); };
  bindNeutralBlock();
  bindBolasSesionBlock();
  bindBocaBlock();
  bindSpecialsBlocks();
  bindSpeedRow();
  SLIDERS.forEach(bindSliderRow);
  document.getElementById("stDefaults").onclick = () => {
    PARAMS.forEach(([k, , , , st]) => {
      const el = document.getElementById("p_" + k);
      if (!el) return;
      if (st === null) el.checked = !!CFG_BASE[k]; else el.value = CFG_BASE[k];
    });
    SLIDERS.forEach(([k, , , , st, unit]) => {
      const el = document.getElementById("s_" + k), out = document.getElementById("sv_" + k);
      if (!el) return;
      el.value = CFG_BASE[k];
      if (out) out.textContent = formatSliderVal(CFG_BASE[k], st, unit);
    });
    curUsarNeutrales = !!CFG_BASE.usarNeutrales;
    curNeutralValor = CFG_BASE.neutralValor;
    curNeutralesInicial = CFG_BASE.neutralesInicial;
    document.getElementById("neutralBlock").innerHTML = neutralBlockHtml();
    bindNeutralBlock();
    Object.keys(BOLAS_SESION).forEach(k => {
      const [, , st, unit] = BOLAS_SESION[k];
      const el = document.getElementById("s_" + k), out = document.getElementById("sv_" + k);
      if (!el) return;
      el.value = CFG_BASE[k];
      if (out) out.textContent = formatSliderVal(CFG_BASE[k], st, unit || "");
    });
    Object.keys(BOCA).forEach(k => {
      const [, , st] = BOCA[k];
      const el = document.getElementById("s_" + k), out = document.getElementById("sv_" + k);
      if (!el) return;
      el.value = CFG_BASE[k];
      if (out) out.textContent = k === "bocaCrecimiento" ? formatPercent(CFG_BASE[k], st) : formatSliderVal(CFG_BASE[k], st, "");
    });
    updateBocaPreview();
    SPECIALS.forEach(spec => { curUsarSpecial[spec.usar] = !!CFG_BASE[spec.usar]; });
    document.getElementById("specialsBlock").innerHTML = specialsBlockHtml(k => CFG_BASE[k]);
    bindSpecialsBlocks();
    ["velocidadMin", "velocidad", "velocidadMax"].forEach(k => {
      const el = document.getElementById((k === "velocidad" ? "s_" : "p_") + k);
      if (el) el.value = CFG_BASE[k];
    });
  };
}
function openSettings() { gamePaused = true; renderSettings(); settingsModal.classList.remove("hidden"); }
function closeSettings() { gamePaused = false; settingsModal.classList.add("hidden"); updateOverlay(); }
settingsBtn.onclick = openSettings;
document.getElementById("settingsClose").onclick = closeSettings;

// ---------------- Arranque ----------------
loadLocal();
updateOverlay();
</script>
</body>
</html>
